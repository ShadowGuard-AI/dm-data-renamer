<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="A gilder bench in three rows: shelves with drifting dust, a bookplate tray, and a cushion where a hand lays gold leaf">
  <rect x="0" y="0" width="800" height="360" fill="#F3E5C0"/>
  <!-- Row 1: shelves and bound books stay put; motes wander down the sunbeam -->
  <g>
    <rect x="20" y="14" width="760" height="96" fill="#543214"/>
    <line x1="20" y1="62" x2="780" y2="62" stroke="#966634" stroke-width="5"/>
    <g fill="#E2CC9E" stroke="#2B2118" stroke-width="2">
      <rect x="60" y="26" width="26" height="72"/><rect x="96" y="20" width="26" height="78" fill="#B07846"/>
      <rect x="132" y="30" width="26" height="68" fill="#8C5A30"/><rect x="300" y="24" width="26" height="74"/>
      <rect x="336" y="28" width="26" height="70" fill="#B07846"/><rect x="560" y="22" width="26" height="76" fill="#C4A86E"/>
      <rect x="596" y="30" width="26" height="68"/><rect x="700" y="26" width="26" height="72" fill="#8C5A30"/>
    </g>
    <g fill="#F6C945">
      <circle cx="220" cy="20" r="3"><animate attributeName="cy" values="16;104" dur="9s" repeatCount="indefinite"/><animate attributeName="cx" values="220;238" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="30" r="2.4"><animate attributeName="cy" values="24;106" dur="12s" repeatCount="indefinite"/><animate attributeName="cx" values="470;452" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="14" r="2.8"><animate attributeName="cy" values="14;100" dur="10s" repeatCount="indefinite"/><animate attributeName="cx" values="650;668" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <polygon points="180,10 330,10 430,110 250,110" fill="#FFEEAA" opacity="0.25"/>
  </g>
  <!-- Row 2: the bookplate tray; a hand picks up one loose plate, flips it once, returns it -->
  <g>
    <rect x="120" y="140" width="560" height="70" fill="#543214"/>
    <g stroke="#2B2118" stroke-width="2">
      <rect x="150" y="152" width="62" height="46" fill="#FAF2D8"/>
      <rect x="240" y="152" width="62" height="46" fill="#FAF2D8"/>
      <rect x="470" y="152" width="62" height="46" fill="#FAF2D8"/>
      <rect x="560" y="152" width="62" height="46" fill="#FAF2D8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -26; 0 0" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
      <rect x="345" y="152" width="62" height="46" fill="#FAF2D8" stroke="#2B2118" stroke-width="2">
        <animateTransform attributeName="transform" type="scale" values="1 1; -1 1; 1 1" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite" additive="sum"/>
      </rect>
      <rect x="330" y="128" width="34" height="16" rx="7" fill="#E2CC9E" stroke="#2B2118" stroke-width="2"/>
    </g>
    <rect x="156" y="158" width="50" height="34" fill="none" stroke="#C68E26" stroke-width="2"/>
    <rect x="566" y="158" width="50" height="34" fill="none" stroke="#C68E26" stroke-width="2"/>
  </g>
  <!-- Row 3: the cushion; a hand ferries the leaf on a knife, lays it, the brush strokes it smooth -->
  <g>
    <polygon points="220,268 580,268 620,330 260,330" fill="#F6E9C0" stroke="#2B2118" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-150 0; 60 0; 60 0; -150 0" keyTimes="0;0.45;0.8;1" dur="11s" repeatCount="indefinite"/>
      <line x1="330" y1="292" x2="470" y2="292" stroke="#96969B" stroke-width="5"/>
      <line x1="470" y1="292" x2="540" y2="292" stroke="#2B2118" stroke-width="8"/>
      <polygon points="368,246 428,238 486,244 492,272 430,282 372,274" fill="#F6C945" stroke="#92661A" stroke-width="2"/>
      <polygon points="372,274 392,258 420,268" fill="#FFF0AF"/>
      <rect x="520" y="252" width="36" height="17" rx="8" fill="#E2CC9E" stroke="#2B2118" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 44 0; 0 0" dur="3.5s" begin="5s" repeatCount="indefinite"/>
      <line x1="600" y1="262" x2="648" y2="292" stroke="#543214" stroke-width="7"/>
      <line x1="648" y1="292" x2="668" y2="306" stroke="#2B2118" stroke-width="6"/>
    </g>
    <ellipse cx="706" cy="300" rx="17" ry="13" fill="#9E2B25"/>
  </g>
</svg>
